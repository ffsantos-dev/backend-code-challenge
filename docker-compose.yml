services:
  mysql:
    image: mysql:8.0
    container_name: medications-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medications
      MYSQL_USER: medications_user
      MYSQL_PASSWORD: medications_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: