services:
  mysql:
    image: mysql:8.0
    container_name: medications-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medications
      MYSQL_USER: medications_user
      MYSQL_PASSWORD: medications_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: src/Medications.Api/Dockerfile
    container_name: medications-api
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: Server=mysql;Port=3306;Database=medications;User=medications_user;Password=medications_pass;
    ports:
      - "8080:8080"

volumes:
  mysql_data: